name: Build and Deploy to AWS

on:
  push:
    branches:
      - dev

env:
  APP_NAME: metaadvisor-api
  AWS_REGION: ap-southeast-3
  ECR_REGISTRY: 022499040607.dkr.ecr.ap-southeast-3.amazonaws.com
  ECR_REPOSITORY: metaadvisor-api
  ECS_SERVICE: dev-metaadvisor-api
  ECS_CLUSTER: ecs-metaadvisor-dev
  ENVIRONMENT: dev

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ github.ref_name }}

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
    
    - name: aws-ssm-to-env
      uses: eliasjcjunior/aws-ssm-parameters-action@main
      with:
        recursive: true
        split-env: true
        upper-case: true
        with-decryption: true
        paths: |
          /development/metaadvisor-api

    - name: Get Env
      id: get-env
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      run: |
        echo "IMAGE_TAG=`echo ${GITHUB_SHA} | cut -c1-8`" >> $GITHUB_ENV
        echo "ECR_REPOSITORY=`echo ${{ env.ECR_REPOSITORY }}`" >> $GITHUB_ENV
        echo "ENVIRONMENT=`echo ${{ env.ENVIRONMENT }}`" >> $GITHUB_ENV
        echo "IMG_REG=`echo ${{ env.ECR_REGISTRY }}`" >> $GITHUB_ENV

    - name: Replace ENV With Value
      id: replace-env
      run: |
        sudo apt install -y gettext
        envsubst < Dockerfile > Dockerfile.temp && rm Dockerfile && mv Dockerfile.temp Dockerfile
    
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Docker Build and Push
      uses: docker/build-push-action@v3
      with:
        context: .
        push: true
        platforms: linux/arm64
        tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY}}:${{ env.IMAGE_TAG }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.ENVIRONMENT }}-${{ env.IMAGE_TAG }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.ENVIRONMENT }}-latest

  deploy:
    name: Deploy
    needs: [build]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ github.ref_name }}

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
    
    - name: Get Env
      id: get-env
      run: |
        echo "IMAGE_TAG=`echo ${{ github.ref_name }}`" >> $GITHUB_ENV
        echo "ECR_REPOSITORY=`echo ${{ env.ECR_REPOSITORY }}`" >> $GITHUB_ENV
        echo "ENVIRONMENT=`echo ${{ env.ENVIRONMENT }}`" >> $GITHUB_ENV

    - name: Install dependencies package
      run: |
        sudo apt install -y zip unzip ca-certificates

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.6.6"

    - name: Deploy Amazon ECS task definition
      env:
        ECS_CLUSTER_NAME: ${{ env.ECS_CLUSTER }}
        ENVIRONMENT: ${{ env.ENVIRONMENT }}
        ECS_SERVICE: ${{ env.ECS_SERVICE }}
        IMAGE: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.ENVIRONMENT }}-${{ env.IMAGE_TAG }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      run: |
        cd .github/config/dev
        export TF_VAR_ECS_CLUSTER_NAME=$ECS_CLUSTER_NAME
        export TF_VAR_ENVIRONMENT=$ENVIRONMENT
        export TF_VAR_ECS_SERVICE=$ECS_SERVICE
        export TF_VAR_IMAGE=$IMAGE
        terraform init
        terraform plan -no-color
        terraform apply -auto-approve